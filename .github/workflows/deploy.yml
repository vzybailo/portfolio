name: Simple Deploy to Hostinger

on:
  push:
    branches:
      - main   # ветка для деплоя

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Получаем код
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Билдим Vue проект
      - name: Build project
        run: |
          npm ci
          npm run build

      # 3️⃣ Загружаем dist на Hostinger через SFTP
      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "dist/*"
          target: "/domains/zybailo.com/public_html"
